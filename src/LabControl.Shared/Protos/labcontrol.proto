syntax = "proto3";

package labcontrol.v1;

option csharp_namespace = "LabControl.Shared.Protocol";

// Contracts for all console <-> agent traffic. docs/PROTOCOL.md explains intent and
// flows and MUST be updated in the same change as this file. Fields are only ever
// added, never renumbered or reused.
//
// FROZEN SUBSET (D-19) — Hello, Heartbeat, Job with kind SELF_UPDATE, and JobResult keep
// their wire-version-1 meaning forever. Fields may be added to them; nothing in them may
// ever be renumbered, removed, re-purposed, or made mandatory for the exchange to
// succeed. This is what guarantees that an agent of any age can still connect to a
// console of any age and be told to update itself -- i.e. that a bad release is always
// fixable remotely instead of by visiting every PC. Everything else may evolve freely.

// ---------------------------------------------------------------------------
// Enrollment: used once per PC, before the agent has a certificate.
// The connection is server-authenticated TLS only (the agent already pins the lab CA
// from the USB payload); the client has no certificate yet.
// ---------------------------------------------------------------------------

service EnrollmentService {
  rpc Enroll (EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  string lab_id           = 1;
  string agent_id         = 2;
  int32  number           = 3;   // the sticker on the PC
  string hostname         = 4;
  string mac              = 5;
  string enrollment_code  = 6;   // single use; burned by the console (D-14)
  bytes  csr              = 7;   // PKCS#10, the keypair never leaves the PC
  int32  protocol_version = 8;
}

message EnrollResponse {
  bytes  agent_certificate = 1;
  bytes  ca_certificate    = 2;
  string lab_id            = 3;
  int64  server_time_unix  = 4;
}

// ---------------------------------------------------------------------------
// Main service: mutual TLS, both sides validated against the lab CA.
// ---------------------------------------------------------------------------

service AgentService {
  rpc Link      (stream AgentMessage) returns (stream ConsoleMessage); // long-lived, 1 per agent
  rpc PushVideo (stream VideoFrame)   returns (VideoAck);              // opened on demand
  rpc PullFile  (FileRequest)         returns (stream FileChunk);      // agent downloads
  rpc PushFile  (stream FileChunk)    returns (FileAck);               // agent uploads
  rpc GetUploadStatus (FileRequest)  returns (FileAck);               // committed upload offset
  rpc RequestUpload (UploadRequest)  returns (UploadGrant);           // the agent asks for a grant once its file exists (M6, D-77)
  rpc Renew     (RenewRequest)        returns (RenewResponse);         // certificate renewal (D-25)
  rpc PullBroadcast (BroadcastRequest) returns (stream VideoFrame);    // teacher's screen, agent dials (M6, D-71)
}

// Certificate renewal over the existing mutual-TLS link (D-25). The agent's identity --
// lab, agent id, number -- comes from the certificate it presented for this connection,
// never from the request, so a renewal can only ever re-issue what the peer already is.
// The console needs the lab key unlocked to sign; until then it answers `refusal` and
// the agent keeps using its current certificate and asks again later.
message RenewRequest {
  bytes csr = 1;  // PKCS#10 for a fresh keypair, generated on the PC
}

message RenewResponse {
  bytes  agent_certificate = 1;  // empty when refused
  int64  server_time_unix  = 2;
  string refusal           = 3;  // plain language, empty when issued
}

message AgentMessage {
  oneof payload {
    Hello        hello         = 1;
    Heartbeat    heartbeat     = 2;
    Inventory    inventory     = 3;
    SessionState session_state = 4;
    JobProgress  job_progress  = 5;
    JobResult    job_result    = 6;
    Event        event         = 7;
    Pong         pong          = 8;
    ExamState    exam_state    = 9;
    RevocationState revocation_state = 10;  // sent right after Hello (D-21)
    InternetState   internet_state   = 11;  // on every policy change and service start (D-22)
    OverlayState    overlay_state    = 12;  // what the PC shows, re-sent after Welcome (M6, D-70)
  }
}

message ConsoleMessage {
  oneof payload {
    Welcome      welcome       = 1;
    Ping         ping          = 2;
    Job          job           = 3;
    VideoControl video_control = 4;
    Input        input         = 5;
    Overlay      overlay       = 6;
    ExamMode     exam_mode     = 7;
    Revocation   revocation    = 8;
    UpdateAgent  update_agent  = 9;
    InternetPolicy internet_policy = 11;  // standalone internet control (D-22)
  }
  // Was `VideoFrame broadcast = 10`, never sent by any build: the teacher's screen travels on
  // its own server-streaming PullBroadcast call with per-PC flow control, never on Link,
  // whose outgoing queue is unbounded (M6, D-71).
  reserved 10;
  reserved "broadcast";
}

message Hello {
  string agent_id           = 1;
  string lab_id             = 2;
  int32  number             = 3;
  string agent_version      = 4;
  int32  protocol_version   = 5;
  string certificate_serial = 6;  // lets a migrated console match restored machines
  string mac                = 7;
  int64  boot_time_unix     = 8;
  UpdateState update_state  = 9;  // where this PC stands in a rollout (D-19)
  // The console instance this agent was linked to before this link, empty if none since
  // boot. Lets a console name the PCs another teacher machine currently holds (D-21).
  string previous_instance_id = 10;
}

// Reported in Hello so a failed rollout is visible in the lab view rather than only in a
// log on the PC.
message UpdateState {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    STABLE            = 1;
    ON_PROBATION      = 2;  // running a new version that has not been accepted yet
    ROLLED_BACK       = 3;  // a version was undone; see failed_version / reason
  }
  Phase  phase              = 1;
  int64  probation_ends_unix = 2;  // 0 unless phase is ON_PROBATION
  string failed_version     = 3;   // set when phase is ROLLED_BACK
  string reason             = 4;   // plain language, shown to the teacher as-is
}

message Welcome {
  int64  server_time_unix    = 1;  // agents correct their clock skew from this
  string instance_id         = 2;  // which console instance is serving the lab
  string instance_name       = 3;
  reserved 4;                      // was revocation_version; the list is a set now (D-21)
  repeated string revoked_serials = 5;  // what this console holds; the agent answers
                                        // with RevocationState and the console sends
                                        // the entries the agent is missing

  // M5 (D-58): what the console serving this link may do, so an agent can name the access
  // level in an event without re-parsing the certificate. Additive and INFORMATIONAL: the
  // authority is the subject OU of the console leaf the TLS handshake validated, and every
  // refusal is decided from that leaf, never from this field. Agents that do not know the
  // field ignore it.
  enum ConsoleAccess {
    CONSOLE_ACCESS_UNSPECIFIED = 0;
    ADMINISTRATOR              = 1;
    TEACHER                    = 2;
  }
  ConsoleAccess console_access = 6;

  // M7 portion 2 (D-87): the console's interface language -- "uk", "en" or "ru". The PC writes
  // the words it sends on this link (event messages, job results, refusals) in it, and keeps it
  // for the words it sends before the next Welcome. Empty or unknown = English. Agents that do
  // not know the field ignore it and keep writing English.
  string language = 7;
}

message Heartbeat { int64 sent_at_unix = 1; }
message Ping      { int64 sent_at_unix = 1; }
message Pong      { int64 ping_sent_at_unix = 1; int64 sent_at_unix = 2; }

message Inventory {
  string hostname         = 1;
  string windows_build    = 2;
  string cpu              = 3;
  int64  memory_bytes     = 4;
  int64  disk_total_bytes = 5;
  int64  disk_free_bytes  = 6;
  int64  uptime_seconds   = 7;
  string logged_on_user   = 8;
  repeated InstalledPackage packages = 9;
}

message InstalledPackage {
  string name    = 1;
  string version = 2;
}

message SessionState {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    LOGON            = 1;
    LOGOFF           = 2;
    LOCK             = 3;
    UNLOCK           = 4;
  }
  Kind   kind         = 1;  // what just happened; UNSPECIFIED for a plain status refresh
  string user         = 2;  // the account in the interactive session, empty at the logon screen
  uint32 session_id   = 3;
  bool   helper_alive = 4;  // session.exe is running in that session and talking to the service
  bool   locked       = 5;  // the current state, whatever `kind` says (M2)
}

message Event {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    INFO                 = 1;
    WARNING              = 2;
    ERROR                = 3;
  }
  Severity severity = 1;
  string   code     = 2;  // stable identifier, e.g. "capture.duplication_failed"
  string   message  = 3;  // plain language, shown to the teacher as-is
  int64    at_unix  = 4;
}

// ---------------------------------------------------------------------------
// Jobs: every action is a job, idempotent by id.
// ---------------------------------------------------------------------------

message Job {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    SHUTDOWN         = 1;
    REBOOT           = 2;
    LOGOFF           = 3;
    RUN_SCRIPT       = 4;
    INSTALL_PACKAGE  = 5;
    RESET_PROFILE    = 6;
    SEND_FILE        = 7;
    COLLECT_FILES    = 8;
    SET_CONFIG       = 9;
    SELF_UPDATE      = 10;
    REKEY            = 11;
  }
  string id                 = 1;
  Kind   kind               = 2;
  map<string, string> args  = 3;
  int32  timeout_seconds    = 4;
}

message JobProgress {
  string job_id  = 1;
  int32  percent = 2;
  string line    = 3;  // one line of captured output
}

message JobResult {
  string job_id       = 1;
  bool   ok           = 2;
  int32  exit_code    = 3;
  string message      = 4;
  string artifact_ref = 5;  // set when the job produced an upload
  string outcome      = 6;  // M7 portion 4 (D-89): a stable code for install_package, e.g. "package.installed"
}

// ---------------------------------------------------------------------------
// Video and input
// ---------------------------------------------------------------------------

message Rect { int32 x = 1; int32 y = 2; int32 width = 3; int32 height = 4; }

enum VideoMode {
  VIDEO_MODE_UNSPECIFIED = 0;
  THUMBNAIL              = 1;
  FULL                   = 2;
}

message VideoFrame {
  string    agent_id   = 1;
  uint64    seq        = 2;
  int64     at_unix_ms = 3;
  int32     width      = 4;
  int32     height     = 5;
  VideoMode mode       = 6;
  repeated Rect dirty  = 7;
  bytes     jpeg       = 8;
  bool      keyframe   = 9;
  string    codec      = 10;  // reserved: "jpeg" today, "h264" is an M6 option
  int32     quality    = 11;  // the JPEG quality this frame was encoded at (D-37: auto mode varies it)
}

message VideoAck { uint64 last_seq = 1; }

// Agent -> console (M6 portion 2, D-71): the agent asks for the broadcast an Overlay
// BROADCAST_START named, and receives the teacher's screen as VideoFrames in FULL mode --
// one keyframe first, then dirty-rectangle deltas, at most BroadcastWidth pixels wide -- for
// as long as the console broadcasts it. The call ends when the teacher stops, the console
// leaves the lab, the link ends, or the agent's own BroadcastHardLimit passes; the agent
// takes the overlay down whenever it ends. Not a session in policy.json: nothing about it
// survives a restart.
message BroadcastRequest {
  string session_id = 1;  // from Overlay.session_id of the BROADCAST_START
}

message VideoControl {
  bool      active               = 1;
  VideoMode mode                 = 2;
  double    frames_per_second    = 3;
  int32     quality              = 4;
  bool      request_keyframe     = 5;
  int32     max_bits_per_second  = 6;
}

message Input {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    MOUSE_MOVE       = 1;
    MOUSE_BUTTON     = 2;
    MOUSE_WHEEL      = 3;
    KEY              = 4;
    TEXT             = 5;
    CTRL_ALT_DEL     = 6;
  }
  Kind   kind    = 1;
  double x       = 2;  // normalized 0..1, so resolution differences do not matter
  double y       = 3;
  int32  button  = 4;
  int32  delta   = 5;
  int32  vk      = 6;
  int32  scan    = 7;
  string text    = 8;
  bool   pressed = 9;
}

message Overlay {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    LOCK             = 1;
    UNLOCK           = 2;
    BROADCAST_START  = 3;
    BROADCAST_STOP   = 4;
  }
  Kind   kind               = 1;
  string message            = 2;
  string session_id         = 3;  // M6: one per lock, so a re-sent LOCK is the same lock
  int64  until_seconds      = 4;  // M6: how long from arrival, a duration -- the agent stamps it on ITS clock (no NTP in the lab); 0 = until lifted; negative = refused
  int64  hard_limit_seconds = 5;  // M6: a proposed duration; the agent clamps it to LockHardLimit on its own clock and reports what it holds; <= 0 = the ceiling
  string language           = 6;  // M7 (D-87): LOCK only -- the language of the stock words on the lock screen ("uk", "en", "ru"), the setting console's; kept with the lock and passed down the pipe; empty or unknown = English
}

// Agent -> console (and helper -> service): what the PC is actually showing, sent on every
// change, after every Welcome, and as the answer to a refused Overlay (M6, D-70). `kind` is
// what is on the screen now -- LOCK, BROADCAST_START, or KIND_UNSPECIFIED for nothing -- and
// never echoes a request that was not applied.
message OverlayState {
  Overlay.Kind kind         = 1;
  string session_id         = 2;
  int64  since_unix         = 3;  // the PC's own clock, as are the two below
  int64  until_unix         = 4;  // 0 = until lifted
  int64  hard_limit_unix    = 5;  // the limit the agent holds, after its own clamp
  bool   input_blocked      = 6;  // the hooks were installed by the most recent re-arm (never BlockInput, see reason)
  string reason             = 7;  // stable codes (overlay.helper_down, overlay.hook_refused, ...), space-separated; empty when all is well
  string set_by_instance    = 8;  // the console instance whose Overlay this is
  string problem            = 9;  // why an Overlay was refused or could not be applied; empty otherwise
  int64  remaining_seconds  = 10; // seconds until the PC lifts it by itself, as of sending; the console's countdown never reads the PC's clock
}

// ---------------------------------------------------------------------------
// Exam mode: four independent switches, enforced by the agent, fail-safe (D-16).
// ---------------------------------------------------------------------------

message CollectSpec {
  string folder         = 1;  // relative to the student profile (CollectRequest), chosen when the exam is set up, not the whole desktop
  string destination_id = 2;  // never sent: where the work lands is the console's alone (D-77)
  bool   on_end         = 3;  // informational; the console collects when the exam ends
}

message ExamMode {
  string session_id                 = 1;  // stable, so a re-sent message is the same exam and a late or reconnecting PC joins it
  bool   active                     = 2;  // true starts or re-states the exam; false ends it (any console of the lab may, M6 decision 4)
  // Were absolute console-clock moments, never sent by any build: the lab has no time source,
  // so an exam carries durations like a lock and an internet policy (M6 portion 4, D-75).
  reserved 3, 4;
  reserved "ends_at_unix", "hard_limit_unix";
  string message                    = 5;  // the teacher's line in the strip on the student's screen
  reserved 6;                             // was block_internet; now an InternetPolicy (D-22)
  repeated string allowed_programs  = 7;  // executable names (idea64.exe); matched by name only, case-insensitively
  CollectSpec collect               = 8;  // M6 portion 5: the folder created at the start; the console collects it at the end (D-77)
  InternetPolicy internet           = 9;  // absent or OPEN = internet untouched; its own limits are ignored -- it lives and dies with the exam
  int64  until_seconds              = 10; // the timer: how long from arrival, stamped on the PC's clock; 0 = no timer; negative = refused
  int64  hard_limit_seconds         = 11; // a proposed duration; the agent clamps it to ExamHardLimit on its own clock; <= 0 = the ceiling
  bool   restrict_programs          = 12; // the allowed-programs switch; off = anything runs, whatever allowed_programs says
  string preset_name                = 13; // for the tile badge
  string language                   = 14; // M7 (D-87): the language of the strip's stock words, its notices and the "time is up" lock ("uk", "en", "ru"), the setting console's; empty or unknown = English
}

// Agent -> console: the exam the PC enforces now, sent on every change, after every Welcome,
// when the whitelist closed something, and as the answer to a refused ExamMode (D-75). It
// never echoes a request that was not applied: `active` false is "no exam on this PC".
message ExamState {
  string session_id                = 1;
  bool   active                    = 2;
  reserved 3;                             // was ends_at_unix, never sent; see until_unix
  reserved 4;                             // was internet_blocked; see InternetState
  bool   whitelist_enforced        = 5;  // the allowed-programs switch is on and the service is watching the session
  repeated string terminated_recently = 6;  // what the whitelist actually closed lately, most recent first
  int64  since_unix                = 7;  // the PC's own clock, as are the two below
  int64  until_unix                = 8;  // 0 = no timer
  int64  hard_limit_unix           = 9;  // the limit the agent holds, after its own clamp
  int64  remaining_seconds         = 10; // seconds until the PC ends it by itself, as of sending
  string set_by_instance           = 11; // the console instance whose exam this is
  string preset_name               = 12;
  string message                   = 13;
  repeated string allowed_programs = 14; // the names enforced, normalized (lower case, ".exe")
  bool   restrict_programs         = 15;
  string problem                   = 16; // why an ExamMode was refused or could not be applied; empty otherwise
  string reason                    = 17; // stable codes (exam.no_user, exam.whitelist_suspended, ...), space-separated; empty when all is well
}

// ---------------------------------------------------------------------------
// Internet control (D-22, ARCHITECTURE 6.2): open / whitelist / blocked, standalone or as
// the exam's internet switch. Enforced by Windows Firewall; names are turned into allow
// rules by a resolver on the loopback interface. Fail-safe like exam mode.
// ---------------------------------------------------------------------------

message InternetPolicy {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    OPEN             = 1;  // standalone: lift the standalone policy, whatever its session
    WHITELIST        = 2;
    BLOCKED          = 3;
  }
  string session_id             = 1;  // one per application, like an exam session
  Mode   mode                   = 2;
  repeated string allowed_hosts = 3;  // WHITELIST only; hostnames, optional leading "*." (which also matches the name itself)
  // M6 portion 3 (D-73): both limits are DURATIONS from arrival, stamped on the PC's clock --
  // the lab has no time source (D-70 item 6). No build ever sent the absolute fields these replace.
  int64  until_seconds          = 4;  // 0 = until lifted; negative = refused
  int64  hard_limit_seconds     = 5;  // a proposed duration; the agent clamps it to InternetPolicyHardLimit on its own clock; <= 0 = the ceiling
  string preset_name            = 6;  // for the tile badge
  // Change only allowed_hosts of the session `session_id` the PC holds, keeping its timing
  // (the console's "Allow" on a refused name, D-74); refused when the PC holds no such session.
  bool   amend_hosts            = 7;
}

// Agent -> console: the internet policy the PC enforces now, sent on every change, after every
// Welcome, when the refused names change (at most every InternetStateRefusedInterval), and as
// the answer to a refused InternetPolicy (M6 portion 3, D-73). `mode` is what is enforced --
// OPEN for nothing -- and never echoes a request that was not applied.
message InternetState {
  InternetPolicy.Mode mode         = 1;
  string session_id                = 2;
  int64  until_unix                = 3;  // the PC's own clock; 0 = until lifted
  bool   resolver_active           = 4;
  repeated string refused_recently = 5;  // names the whitelist resolver refused lately, most recent first
  int64  hard_limit_unix           = 6;  // the limit the agent holds, after its own clamp
  int64  remaining_seconds         = 7;  // seconds until the PC lifts it by itself, as of sending
  string set_by_instance           = 8;  // the console instance whose policy this is
  string preset_name               = 9;
  repeated string allowed_hosts    = 10; // WHITELIST: the patterns enforced, normalized
  string problem                   = 11; // why an InternetPolicy was refused or could not be applied; empty otherwise
  string reason                    = 12; // stable codes (internet.restore_unconfirmed, ...), space-separated; empty when all is well
}

// ---------------------------------------------------------------------------
// Trust maintenance
// ---------------------------------------------------------------------------

// One revoked certificate -- a console instance or an agent alike. Self-authenticating:
// `signature` is the LAB KEY's signature over serial|revoked_at_unix|reason, verified
// against the pinned CA by whoever receives it. There is no list version and no owner;
// every party keeps the union of the entries it has seen (D-21).
message RevocationEntry {
  string serial          = 1;
  int64  revoked_at_unix = 2;
  string reason          = 3;
  bytes  signature       = 4;
}

message Revocation {
  reserved 1, 2;                          // was version + bare serials
  repeated RevocationEntry entries = 3;
}

// Agent -> console, right after Hello: everything the agent holds revoked, so a console
// that was switched off when another teacher machine revoked something catches up.
message RevocationState {
  repeated RevocationEntry entries = 1;
}

// Reserved for M4's signed rollout. The M2 push-and-restart does not use this message: the
// self_update Job's args carry `version` and the manifest's PullFile reference and hash, and
// the manifest below names the files (PROTOCOL "self_update", D-33).
message UpdateAgent {
  string version    = 1;
  string bundle_ref = 2;  // fetched with PullFile
  string sha256     = 3;  // over the serialized manifest

  // The manifest is signed with the LAB KEY, and the agent verifies it against the CA
  // certificate it pinned at install -- not against the TLS session that carried it. The
  // binaries are unsigned (D-15), so this is the only authenticity an update ever has.
  bytes  manifest           = 4;  // serialized UpdateManifest
  bytes  manifest_signature = 5;
}

message UpdateManifest {
  string version               = 1;
  string min_installed_version = 2;  // refuse to apply on anything older
  repeated UpdateFile files    = 3;
  int32  probation_seconds     = 4;  // 0 = Defaults.UpdateProbation
}

message UpdateFile {
  string relative_path = 1;  // inside app/<version>/
  int64  size          = 2;
  string sha256        = 3;
}

// ---------------------------------------------------------------------------
// File transfer
// ---------------------------------------------------------------------------

message FileRequest {
  string reference = 1;
  int64  offset    = 2;  // resume after a reconnect
}

message FileChunk {
  string reference   = 1;
  int64  offset      = 2;
  bytes  data        = 3;
  bool   last        = 4;
  string sha256      = 5;  // set on the last chunk
  int64  total_bytes = 6;
}

message FileAck {
  string reference    = 1;
  bool   ok           = 2;
  int64  bytes_stored = 3;
  string message      = 4;
  string sha256       = 5;  // expected content hash bound to the upload grant
}

// M6 portion 5 (D-77): a job whose upload's size and hash are known only once the agent has
// made the file (collect_files zips a folder) asks the console for its D-42 grant. The console
// grants only for an in-flight job of that kind, for that PC, that this console delivered.
message UploadRequest {
  string job_id = 1;
  int64  size   = 2;
  string sha256 = 3;
}

message UploadGrant {
  string reference = 1;  // the grant to PushFile to; empty = refused
  string problem   = 2;  // why it was refused, plain language; empty when granted
}

// ---------------------------------------------------------------------------
// Agent service <-> session helper, over the local named pipe (PROTOCOL.md, "Agent <->
// Session helper"). Length-prefixed protobuf; the same VideoControl / Input / Overlay /
// VideoFrame / SessionState types as the network, wrapped so each side reads one type.
// The helper never talks to the network (D-06).
// ---------------------------------------------------------------------------

// Service -> helper.
message ServiceMessage {
  oneof payload {
    Ping         ping          = 1;  // the helper answers with a HelperStatus
    VideoControl video_control = 2;  // M3
    Input        input         = 3;  // M3
    Overlay      overlay       = 4;  // M6: LOCK / UNLOCK / BROADCAST_START / BROADCAST_STOP; re-asserted to every fresh helper
    VideoFrame   broadcast_frame = 5;  // M6 portion 2: the teacher's screen, as PullBroadcast delivered it (D-71)
    ExamStrip    exam_strip    = 6;  // M6 portion 4: the strip at the top of the student's screen; re-asserted to every fresh helper
    ClosePrograms close_programs = 7;  // M6 portion 4: ask these windows to close, before the service ends what is left (D-75)
    string       language      = 8;  // M7 (D-87): the language the helper writes its events in -- the PC's (Welcome.language); sent on connect and after every Welcome
  }
}

// Service -> helper (M6 portion 4, D-75): what the exam strip shows. A strip with no timer, no
// message and no notice is hidden; a lock or a broadcast always hides it while it shows.
message ExamStrip {
  bool   show          = 1;  // false hides the strip, whatever else is set
  string message       = 2;  // the teacher's line
  int64  until_seconds = 3;  // the countdown, a duration stamped on arrival; 0 = no timer
  string notice        = 4;  // a passing line -- "notepad.exe is not allowed during the exam" -- shown for ExamNoticeDuration; empty = none
  string session_id    = 5;
  string language      = 6;  // M7 (D-87): the exam's language, for the strip's stock words; empty or unknown = English
}

// Service -> helper (M6 portion 4): post WM_CLOSE to the top-level windows of these processes,
// in the session, where the service cannot reach. The service ends whatever is still running
// after ExamSweepGrace; the helper only asks.
message ClosePrograms {
  repeated uint32 process_ids = 1;
}

// Helper -> service.
message HelperMessage {
  oneof payload {
    HelperHello  hello        = 1;  // first message after connecting
    HelperStatus status       = 2;  // every HelperStatusInterval and on every Ping
    VideoFrame   video_frame  = 3;  // M3
    Event        event        = 4;  // relayed to the console as-is
    OverlayState overlay_state = 5;  // M6: what the helper shows and whether its hooks hold
  }
}

message HelperHello {
  uint32 session_id = 1;  // the session the helper found itself in
  uint32 process_id = 2;
  string version    = 3;
}

// What only a process inside the session can see. In M2 it is the whole point of the
// helper: it proves the plumbing works and tells the console which desktop is up.
message HelperStatus {
  string input_desktop  = 1;  // "Default", "Winlogon" (lock screen, logon screen, UAC), "Screen-saver"
  int32  screen_width   = 2;  // the primary display, in pixels
  int32  screen_height  = 3;
  int64  uptime_ms      = 4;  // how long this helper instance has been running
}
